<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新品打样请求校验</title><style>body{margin:0;background:#f3f6f6;color:#21313c;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:26px 20px 40px}h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.2}h2{font-size:1.15rem;margin:0 0 .4em}header{margin-bottom:1.5rem}small{font-weight:700;color:#255c64}section{border:1px solid #d6e2e2;background:white;border-radius:10px;padding:16px;margin:12px 0}section p{margin:0}footer{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}a{color:#07657b}li{margin:10px 0}</style></head><body><main><header><small>亚马逊产品决策网关</small><h1>新品打样请求校验</h1><a href="en.html" hreflang="en">English</a></header><section><h2>输入</h2><p>教学模拟。一份 Amazon US 收纳件概念请求拟判断是否投入 500 件试单，目标贡献利润率为 18%。当前证据数组为空。</p></section><section><h2>过程</h2><p>检查 JSON 版本、产品范围、站点和币种。移除个人资料与凭据，给证据保留编号。配置私有服务后才绑定实际请求与回传结果。</p></section><section><h2>结果</h2><p>仓库测试中合规请求通过结构校验，无效请求返回多项错误。响应示例展示可用决策枚举和 `stage_matrix` 的形状。</p></section><section><h2>判断</h2><p>请求交由获授权的决策服务处理。空证据和示例枚举只用于检查传输合同，实际试单判断需真实资料。</p></section><footer><a href="../index.html">全部案例</a><a href="https://github.com/PDBen-Auto/amazon-product-decision-suite">GitHub</a><a href="https://github.com/PDBen-Auto/amazon-product-decision-suite/blob/main/references/request-schema.md">原案例与依据</a></footer></main></body></html>

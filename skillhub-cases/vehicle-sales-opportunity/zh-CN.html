<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五类载具的同期比较</title><style>body{margin:0;background:#f3f6f6;color:#21313c;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:26px 20px 40px}h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.2}h2{font-size:1.15rem;margin:0 0 .4em}header{margin-bottom:1.5rem}small{font-weight:700;color:#255c64}section{border:1px solid #d6e2e2;background:white;border-radius:10px;padding:16px;margin:12px 0}section p{margin:0}footer{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}a{color:#07657b}li{margin:10px 0}</style></head><body><main><header><small>载具销量机会研究</small><h1>五类载具的同期比较</h1><a href="en.html" hreflang="en">English</a></header><section><h2>输入</h2><p>教学模拟。输入覆盖北美汽车、摩托车、UTV、ATV 和船舶，其中 UTV 含零售和批发两条口径。</p></section><section><h2>过程</h2><p>在同国家、载具类型、指标和同期样本内比较。保留缺口和规模基数，不叠加流量和保有量。</p></section><section><h2>结果</h2><p>合成结果将美国 Aster Canyon 汽车零售标为规模增长，加拿大同车为小基数增长。美国 Demo Explorer 的 UTV 零售与批发各有独立结果。</p></section><section><h2>判断</h2><p>先从规模增长处提出可验证的配件场景，再核车型代际、接口和用户问题。</p></section><footer><a href="../index.html">全部案例</a><a href="https://github.com/PDBen-Auto/vehicle-sales-opportunity-skill">GitHub</a><a href="https://pdben-auto.github.io/vehicle-sales-opportunity-skill/multitype-demo/dashboard.html">原案例与依据</a></footer></main></body></html>

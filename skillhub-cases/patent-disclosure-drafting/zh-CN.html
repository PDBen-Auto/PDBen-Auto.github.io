<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可换光源台灯外壳</title><style>body{margin:0;background:#f3f6f6;color:#21313c;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:26px 20px 40px}h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.2}h2{font-size:1.15rem;margin:0 0 .4em}header{margin-bottom:1.5rem}small{font-weight:700;color:#255c64}section{border:1px solid #d6e2e2;background:white;border-radius:10px;padding:16px;margin:12px 0}section p{margin:0}footer{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}a{color:#07657b}li{margin:10px 0}</style></head><body><main><header><small>专利交底书起草</small><h1>可换光源台灯外壳</h1><a href="en.html" hreflang="en">English</a></header><section><h2>输入</h2><p>教学模拟。台灯需要可换光源、可调倾角及简洁外壳。输入为示意图与发明人提供的合成说明。</p></section><section><h2>过程</h2><p>建立下壳 10、模组 20、倾角支架 30、后锁扣 40 的部件关系。分开标注图中可见事实、发明人描述和待测宣称。</p></section><section><h2>结果</h2><p>交付部件表、五张拟附图索引，以及技术结构和外观描述两组提纲。后锁扣如何释放、所谓防眩效果等保留为待验证。</p></section><section><h2>判断</h2><p>补齐关键动作和底面接触几何后发送专利专业人员审阅。辖区及权利要求范围需实际确认。</p></section><footer><a href="../index.html">全部案例</a><a href="https://github.com/PDBen-Auto/patent-disclosure-drafting-skill">GitHub</a><a href="https://github.com/PDBen-Auto/patent-disclosure-drafting-skill/blob/main/references/example-modular-desk-lamp.md">原案例与依据</a></footer></main></body></html>
